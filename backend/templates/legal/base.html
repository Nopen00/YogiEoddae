<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% endblock %} - 요기어때?</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px 20px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    color: #222;
    background: #fff;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .date { color: #888; font-size: 13px; margin: 0 0 24px; }
  .notice {
    background: #fff4f4;
    color: #c0392b;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 24px;
  }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  p { font-size: 14px; margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 20px; }
  li { font-size: 14px; margin: 4px 0; }
  .footer { margin-top: 40px; font-size: 12px; color: #999; }
  @media (prefers-color-scheme: dark) {
    body { background: #17181a; color: #e6e6e6; }
    .date, .footer { color: #999; }
    .notice { background: #33201f; color: #ff8a80; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="date">{% block date %}{% endblock %}</p>
    {% block notice %}{% endblock %}
    {% block content %}{% endblock %}
    <p class="footer">요기어때?</p>
  </div>
</body>
</html>
